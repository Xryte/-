{% extends 'base.html' %}
{% block title %}{{ category.name }}{% endblock %}

{% block content %}
<h1 class="mb-4"><i class="bi bi-tag"></i> {{ category.name }}</h1>
<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for ad in ads %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5>{{ ad.title }}</h5>
                <p class="text-muted">{{ ad.description|truncatechars:100 }}</p>
            </div>
            <div class="card-footer">
                <a href="{% url 'ads:ad_detail' ad.pk %}" class="btn btn-outline-primary btn-sm">Открыть</a>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12">
        <div class="alert alert-warning">В этой категории пока нет объявлений.</div>
    </div>
    {% endfor %}
</div>
{% endblock %}
